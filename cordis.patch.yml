# NoLetMe bundle layer: add the NoLetMe web panel to the dsh composition.
#
# The row names the package, so it resolves only when `dsh-noletme` is
# installed into the profile (`dsh plugin --profile <name> add ./NoLetMe`).
# A raw absolute Windows path as `name` fails in the ESM loader
# (ERR_UNSUPPORTED_ESM_URL_SCHEME); on Linux a file:// URL works.

- insert:
    - id: noletme
      name: dsh-noletme
